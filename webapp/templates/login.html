<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSense - Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .email-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--accent-emerald);
            background: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="glass-card">
            <div class="login-header">
                <div class="brand-icon">M</div>
                <h1>Medi<span>Sense</span></h1>
                <p>Smart Medicine Box Web Monitoring & Reminder System</p>
            </div>

            <div class="login-actions">
                <!-- Google OAuth redirect link -->
                <a href="/google-login" class="btn btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Sign in with Google
                </a>

                <div class="divider">
                    <span>or sign in with your Gmail address</span>
                </div>

                <form action="/email-login" method="POST" class="email-form">
                    <input type="email" name="email" class="form-input" placeholder="Enter your Gmail (e.g. user@gmail.com)" required>
                    <button type="submit" class="btn btn-primary">Sign In & Connect Gmail</button>
                </form>

                <div class="divider">
                    <span>or try demo mode</span>
                </div>

                <a href="/demo-login" class="btn btn-secondary">
                    ⚡ Instant Demo Sign-in
                </a>
            </div>
        </div>
    </div>
    <footer class="footer">
        MediSense Smart Medicine Box System &copy; 2026
    </footer>
</body>
</html>
